[workspace]
members = ["cli", "core", "pack"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "WTFPL"

[workspace.dependencies]
anyhow = "1.0.104"
bzip2 = "0.6.1"
qbsdiff = "1.4.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
